name: Release
on:
  push:
    tags:
      - v*

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  get_tag:
    if: github.repository == 'hongducdev/booxbook'
    name: Extract tag name
    runs-on: 'ubuntu-24.04'
    outputs:
      tag: ${{ steps.extract.outputs.tag }}

    steps:
      - name: Get tag name
        id: extract
        run: echo "tag=${GITHUB_REF/refs\/tags\//}" >> $GITHUB_OUTPUT

  build:
    if: github.repository == 'hongducdev/booxbook'
    name: Build
    runs-on: 'ubuntu-24.04'
    needs: get_tag

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify tag matches app version
        env:
          RELEASE_TAG: ${{ needs.get_tag.outputs.tag }}
        run: |
          set -e
          version_name=$(sed -nE 's/^[[:space:]]*versionName = "([^"]+)"/\1/p' app/build.gradle.kts)
          test -n "$version_name"
          test "$RELEASE_TAG" = "v$version_name"

      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      # The React Native Gradle plugin lives in js-runtime/node_modules, and settings.gradle.kts
      # resolves it by shelling out to `node` during settings evaluation. Without these three steps
      # the build dies before Gradle configures a single project.
      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          # The npm root is js-runtime/, not the repo root, so the action cannot find the
          # packageManager pin on its own.
          package_json_file: js-runtime/package.json

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: js-runtime/.nvmrc
          cache: pnpm
          cache-dependency-path: js-runtime/pnpm-lock.yaml

      - name: Install JS runtime dependencies
        working-directory: js-runtime
        run: pnpm install --frozen-lockfile

      - name: Build
        run: ./gradlew assembleRelease -Penable-updater

      - name: Sign APK
        uses: r0adkll/sign-android-release@a391126403df92c6a0a3988a829dd47f79b89ed7
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: '35.0.1'

      - name: Rename APK
        run: |
          set -e

          mv app/build/outputs/apk/release/app-universal-release-signed.apk booxbook-${{ needs.get_tag.outputs.tag }}.apk
          mv app/build/outputs/apk/release/app-arm64-v8a-release-signed.apk booxbook-arm64-v8a-${{ needs.get_tag.outputs.tag }}.apk
          mv app/build/outputs/apk/release/app-armeabi-v7a-release-signed.apk booxbook-armeabi-v7a-${{ needs.get_tag.outputs.tag }}.apk
          mv app/build/outputs/apk/release/app-x86-release-signed.apk booxbook-x86-${{ needs.get_tag.outputs.tag }}.apk
          mv app/build/outputs/apk/release/app-x86_64-release-signed.apk booxbook-x86_64-${{ needs.get_tag.outputs.tag }}.apk

      - name: Upload APK
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: booxbook
          path: |
            booxbook-${{ needs.get_tag.outputs.tag }}.apk
            booxbook-arm64-v8a-${{ needs.get_tag.outputs.tag }}.apk
            booxbook-armeabi-v7a-${{ needs.get_tag.outputs.tag }}.apk
            booxbook-x86-${{ needs.get_tag.outputs.tag }}.apk
            booxbook-x86_64-${{ needs.get_tag.outputs.tag }}.apk

  release:
    if: github.repository == 'hongducdev/booxbook'
    name: Create GitHub Release
    runs-on: ubuntu-24.04
    needs: [get_tag, build]
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          merge-multiple: true

      - name: Delete all artifacts
        uses: geekyeggo/delete-artifact@f275313e70c08f6120db482d7a6b98377786765b # v5.1.0
        with:
          failOnError: false
          name: |
            booxbook

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ needs.get_tag.outputs.tag }}
          name: Boox Book ${{ needs.get_tag.outputs.tag }}
          body: |
            ### Added
            - Essentials-inspired fixed floating navigation, settings screens, About screen, appearance controls, and Browse actions.
            - Catppuccin accent selection with matching Latte and Mocha colors.
            - Refreshed Boox Book mascot artwork across the launcher, splash screen, README, and About screen.

            ### Fixed
            - Settings remain inside the More tab with correct nested back navigation and unobstructed bottom content.
            - Theme changes now recolor controls and previews immediately.
            - Final paginated chapters preserve stable right-side padding.

            See [BOOXBOOK_CHANGELOG.md](https://github.com/hongducdev/booxbook/blob/${{ needs.get_tag.outputs.tag }}/BOOXBOOK_CHANGELOG.md)
            for the complete release notes.
            <!-->

            > [!TIP]
            >
            > ### If you are unsure which version to download then go with `booxbook-${{ needs.get_tag.outputs.tag }}.apk`
          files: |
            booxbook-${{ needs.get_tag.outputs.tag }}.apk
            booxbook-arm64-v8a-${{ needs.get_tag.outputs.tag }}.apk
            booxbook-armeabi-v7a-${{ needs.get_tag.outputs.tag }}.apk
            booxbook-x86-${{ needs.get_tag.outputs.tag }}.apk
            booxbook-x86_64-${{ needs.get_tag.outputs.tag }}.apk
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}
